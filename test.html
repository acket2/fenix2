<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test</title>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML += '<div style="color:red; padding:20px; font-family:sans-serif;">' + 
          '<h3>Error: ' + msg + '</h3>' + 
          '<p>' + url + ':' + line + ':' + col + '</p>' + 
          '<pre>' + (error && error.stack ? error.stack : '') + '</pre>' +
          '</div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="color:red; padding:20px; font-family:sans-serif;">' + 
          '<h3>Unhandled Promise Rejection: ' + (event.reason && event.reason.message ? event.reason.message : event.reason) + '</h3>' +
          '<pre>' + (event.reason && event.reason.stack ? event.reason.stack : '') + '</pre>' +
          '</div>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
